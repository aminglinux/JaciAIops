services:
  backend:
    build:
      context: ./aiops-platform/backend
      dockerfile: Dockerfile
    image: aiops-backend:local
    container_name: aiops-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/aiops.db
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-aiops_neo4j_password}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://host.docker.internal:8001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen-plus}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      KNOWLEDGE_GRAPH_PATH: /knowledge_graph
    ports:
      - "8000:8000"
    volumes:
      - ./aiops-platform/backend/data:/app/data
      - ./knowledge_graph:/knowledge_graph:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./aiops-platform/frontend
      dockerfile: Dockerfile
    image: aiops-frontend:local
    container_name: aiops-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  neo4j:
    image: neo4j:5-community
    container_name: aiops-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-aiops_neo4j_password}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_server_http_listen__address: 0.0.0.0:7474
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-aiops_neo4j_password} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j-data:
  neo4j-logs:
